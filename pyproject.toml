[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snypshark"
version = "1.0.0"
description = "Advanced network traffic analysis tool for cybersecurity"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyshark>=0.5.0",
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "colorama>=0.4.0",
    "tqdm>=4.65.0",
    "python-dateutil>=2.8.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0"
]

[tool.setuptools]
packages = ["snyshark"]

[tool.setuptools.package-dir]
snyshark = "src/snyshark"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true