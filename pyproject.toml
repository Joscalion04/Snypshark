[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snypshark"
version = "0.1.0"
description = "PCAP network traffic analyzer for forensics and security investigation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Joseph Leon", email = "joscalion04@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
snypshark = "analyzer.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "pytest-mock>=3.0",
]
dev = [
    "black>=22.0",
    "flake8>=4.0",
    "isort>=5.12.0",
    "mypy>=0.910",
    "pre-commit>=3.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.0",
    "sphinx-autodoc-typehints>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["analyzer"]
python_files = "test_*.py"
addopts = "--verbose --color=yes"

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "assets"]
# B101 (assert_used) is only excluded from tests via .flake8 per-file-ignores;
# in production code an assert finding is a real signal and should not be skipped.
