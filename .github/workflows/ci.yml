# Snypshark CI
#
# Topology (left → right = dependency):
#
#   lint ──────┬──► test (matrix: 3.9 / 3.11 / 3.12)
#              └──► build
#
#   type-check ─── (parallel, independent)
#   security   ─── (parallel, independent)
#
# Required status checks for branch protection on `main`:
#   lint, type-check, test (all matrix legs), build, security

name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: # allow manual runs from the Actions tab

# Cancel a stale run when a new one is triggered on the same ref.
# PRs use the PR number so parallel PRs don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: all jobs only need to read the repo.
permissions:
  contents: read

# Suppress .pyc generation and output buffering across all jobs.
env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

# ── Jobs ──────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. Lint ──────────────────────────────────────────────────────────────
  # Gate: code must be correctly formatted and lint-clean before tests run.
  # Tools and versions must stay in sync with .pre-commit-config.yaml.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linters
        run: |
          pip install \
            "black==24.10.0" \
            "isort==5.13.2" \
            "flake8==7.1.1" \
            "flake8-bugbear>=24.0" \
            "flake8-comprehensions>=3.14"

      - name: black
        run: black --check analyzer/ tests/ main.py setup.py

      - name: isort
        run: isort --check-only analyzer/ tests/ main.py setup.py

      - name: flake8
        run: flake8 analyzer/ tests/ main.py setup.py

  # ── 2. Type check ─────────────────────────────────────────────────────────
  # Runs in parallel with lint — mypy failures are independent of format issues.
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime deps + mypy
        run: pip install -r requirements.txt mypy==1.13.0 types-python-dateutil

      - name: mypy
        run: mypy analyzer/

  # ── 3. Test matrix ────────────────────────────────────────────────────────
  # Only runs if lint passes — no point running tests on unlinted code.
  # fail-fast: false ensures all Python versions are always reported.
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=analyzer \
            --cov-report=xml \
            --cov-report=term-missing \
            -q

      # Enforce a minimum coverage floor on the testable subset of the codebase.
      # Entry points, CLI, and interactive UI are excluded via [tool.coverage.run].omit
      # in pyproject.toml — they require integration tests, not unit tests.
      # Current baseline: ~44%. Threshold set at 40% to allow a small buffer.
      # Raise this value incrementally as the test suite grows — never lower it.
      - name: Enforce coverage threshold (≥40%)
        run: python -m coverage report --fail-under=40

      # Upload the coverage artifact once — from the primary Python version.
      # Retained for 7 days; can be consumed by Codecov or similar later.
      - name: Upload coverage report
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # ── 4. Build verification ─────────────────────────────────────────────────
  # Confirms the package installs cleanly and the CLI entry point is reachable.
  # Runs in parallel with tests — no tshark needed (entry point import only).
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install package in editable mode
        run: pip install -e .

      - name: Verify CLI entry point is importable
        run: python -c "from analyzer.cli import main; print('Entry point OK')"

  # ── 5. Security scan ──────────────────────────────────────────────────────
  # Runs independently — security findings are reported regardless of test
  # results. Uses the same bandit config as the pre-push hook (.pyproject.toml).
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bandit
        run: pip install "bandit==1.7.10"

      - name: Run bandit
        run: |
          bandit \
            -r analyzer/ \
            --configfile pyproject.toml \
            --severity-level medium \
            -q
